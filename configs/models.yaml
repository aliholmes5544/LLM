    gguf_repo: bartowski/gemma-2-27b-it-GGUF
    gguf_file: gemma-2-27b-it-Q4_K_M.gguf
    gguf_bytes: 16645381632
    sha256: 503a87ab47c9e7fb27545ec8592b4dc4493538bd47b397ceb3197e10a0370d23   # HF LFS metadata 2026-10-28
    license: "gemma (Gemma Terms of Use)"
    license_class: open-weight
