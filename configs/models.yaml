    gguf_bytes: 8988110976
    sha256: e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008   # HF LFS metadata 2026-10-28
    license: "apache-2.0"
    license_class: open-source
    chat_template: embedded
