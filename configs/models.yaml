# Detector models (TASK_06 section 1, decision 1; Chapter 3 Section 3.5). Six open-weight instruction-tuned
# models, GGUF Q4_K_M, run through llama.cpp (llama-cpp-python, pinned in requirements.txt) with identical
# decoding everywhere; tier settings (threads, GPU layers) affect speed only.
#
# Where inference runs (QUESTIONS.md item 11, decided 2026-10-28): ALL evaluation inference for all six
# models runs on Colab GPUs (`eval_tier`: colab_t4 for the 7B to 14B models, colab_l4 for gemma-2-27b), so
# that every detector is measured on the same class of hardware (no hardware confound in RQ2) and because
# the CPU projection (about 173 h) was not practical. The laptop (`smoke_tiers` containing laptop) is used
# only for development and the dev smoke test (scripts/06_smoke_dev.py); its results never enter Chapter 4.
#
# Weights are downloaded by scripts/06_download_models.py into `local_dir` (gitignored) and verified against
# `sha256` on every load. The four 7B to 9B hashes were computed from the downloaded files on 2026-10-27 and
# equal the Hugging Face LFS metadata; the 14B and 27B hashes were taken from the Hugging Face LFS metadata
# on 2026-10-28 and are verified by the downloader on Colab before any inference. `gguf_bytes` is the file
# size listed by the repository (sanity check only).
# `license` is the `license` value of the original model card front matter, followed by the agreement
# title where the card names one; `license_class` distinguishes OSI licences from open-weight agreements
# (Section 2.3.3). Exclusion rule: the paraphrase model family (configs/variants.yaml,
# excluded_from_detectors: [phi]) must not appear here; checked 2026-10-27, none of the six is a Phi model.
#
# chat_template: "embedded" = the tokenizer.chat_template stored in the GGUF, applied by llama-cpp-python
# (no hand-written format). system_role: whether the system message reaches the model through that path.
# Where it does not (Gemma 2: the template rejects a system turn; Mistral-7B: llama-cpp-python maps its
# template to the built-in "mistral-instruct" formatter, which drops system messages, found 2026-10-31),
# the runner prepends the system text to the user message, separated by a blank line, for every strategy
# (docs/QUESTIONS.md items 9 and 13). scripts/detect/backend.py refuses a built-in formatter with
# system_role true; tests/test_system_text.py checks delivery for every model whose GGUF is present.

quantization: Q4_K_M
n_ctx: 4096
local_dir: models

tiers:                         # runtime settings file (speed only) and the backend each tier must report
  laptop:   {runtime: local.yaml, backend: cpu,  use: "development and dev smoke tests only"}
  colab_t4: {runtime: cloud.yaml, backend: cuda, use: "evaluation inference, 7B to 14B models (T4, 15 GB)"}
  colab_l4: {runtime: cloud.yaml, backend: cuda, use: "evaluation inference, gemma-2-27b (L4, 24 GB)"}

models:
  llama31-8b:
    name: Meta-Llama-3.1-8B-Instruct
    params_b: 8
    original_repo: meta-llama/Llama-3.1-8B-Instruct        # gated: HF_TOKEN with the licence accepted
    gguf_repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    gguf_file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    gguf_bytes: 4920739232
    sha256: 7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c
    license: "llama3.1 (LLAMA 3.1 COMMUNITY LICENSE AGREEMENT, Llama 3.1 Version Release Date: July 23, 2024)"
    license_class: open-weight
    chat_template: embedded
    system_role: true
    eval_tier: colab_t4
    smoke_tiers: [laptop, colab_t4]

  mistral-7b:
    name: Mistral-7B-Instruct-v0.3
    params_b: 7
    original_repo: mistralai/Mistral-7B-Instruct-v0.3
    gguf_repo: bartowski/Mistral-7B-Instruct-v0.3-GGUF
    gguf_file: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    gguf_bytes: 4372812000
    sha256: 1270d22c0fbb3d092fb725d4d96c457b7b687a5f5a715abe1e818da303e562b6
    license: "apache-2.0"
    license_class: open-source
    chat_template: embedded      # [INST] ... [/INST]; llama-cpp-python uses its built-in "mistral-instruct"
                                 # formatter for this template, which DROPS system messages (item 13), hence:
    system_role: false           # since 2026-10-31 (v0.6.2); the v1 cells run with true are in results/archive/
    eval_tier: colab_t4
    smoke_tiers: [laptop, colab_t4]

  gemma2-9b:
    name: gemma-2-9b-it
    params_b: 9
    original_repo: google/gemma-2-9b-it                    # gated: HF_TOKEN with the terms accepted
    gguf_repo: bartowski/gemma-2-9b-it-GGUF
    gguf_file: gemma-2-9b-it-Q4_K_M.gguf
    gguf_bytes: 5761057728
    sha256: 13b2a7b4115bbd0900162edcebe476da1ba1fc24e718e8b40d32f6e300f56dfe
    license: "gemma (Gemma Terms of Use)"
    license_class: open-weight
    chat_template: embedded      # <start_of_turn>user ...; the model card notes it does not support a system prompt
    system_role: false
    eval_tier: colab_t4
    smoke_tiers: [laptop, colab_t4]

  qwen25-7b:
    name: Qwen2.5-7B-Instruct
    params_b: 7
    original_repo: Qwen/Qwen2.5-7B-Instruct
    gguf_repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    gguf_file: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    gguf_bytes: 4683074240
    sha256: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
    license: "apache-2.0"
    license_class: open-source
    chat_template: embedded      # ChatML (<|im_start|>system / user / assistant)
    system_role: true
    eval_tier: colab_t4
    smoke_tiers: [laptop, colab_t4]

  qwen25-14b:
